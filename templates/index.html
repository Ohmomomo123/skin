<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 皮膚狀態偵測</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #f5f7fa; color: #333; }

    .header {
      background: linear-gradient(135deg, #1F5C9E, #2e86de);
      color: white; padding: 24px 20px; text-align: center;
    }
    .header h1 { font-size: 22px; margin-bottom: 6px; }
    .header p { font-size: 13px; opacity: 0.85; }

    .container { max-width: 480px; margin: 0 auto; padding: 20px; }

    .upload-box {
      background: white; border-radius: 16px; padding: 30px 20px;
      text-align: center; border: 2px dashed #1F5C9E;
      cursor: pointer; margin-bottom: 16px;
    }
    .upload-box input { display: none; }
    .upload-box .icon { font-size: 48px; margin-bottom: 12px; }
    .upload-box p { color: #666; font-size: 14px; }

    #preview { width: 100%; border-radius: 12px; margin-bottom: 16px; display: none; }

    .btn {
      width: 100%; padding: 14px; background: #1F5C9E;
      color: white; border: none; border-radius: 12px;
      font-size: 16px; font-weight: bold; cursor: pointer;
      display: none;
    }
    .btn:active { background: #174a82; }

    .result-card {
      background: white; border-radius: 16px; padding: 20px;
      margin-top: 16px; display: none;
    }
    .result-card > h2 {
      font-size: 16px; color: #888; margin-bottom: 16px; text-align: center;
    }

    .result-title { text-align: center; margin-bottom: 18px; }
    .simple-name {
      font-size: 28px; font-weight: bold; color: #1a1a1a;
      line-height: 1.3; margin-bottom: 4px;
    }
    .pro-name { font-size: 13px; color: #888; }

    .section { margin-bottom: 14px; }
    .section .tag {
      font-size: 11px; color: #888; margin-bottom: 8px; letter-spacing: 0.5px;
    }

    .highlight-box {
      background: #f8f9fb; border-radius: 12px; padding: 16px;
    }
    .highlight-box .main-text {
      font-size: 16px; line-height: 1.6; color: #333;
    }

    .severity-banner {
      border-radius: 14px; padding: 18px 16px; text-align: center;
    }
    .severity-banner .main { font-size: 20px; font-weight: bold; }
    .severity-high { background: #fdecea; color: #c0392b; }
    .severity-medium { background: #fef9e7; color: #b7770d; }
    .severity-low { background: #eafaf1; color: #1e8449; }

    .confidence-hint {
      font-size: 12px; color: #aaa; text-align: center;
      margin-top: 8px; margin-bottom: 4px;
    }

    .action-box {
      background: #f0f6fc; border-left: 4px solid #1F5C9E;
      border-radius: 0 12px 12px 0; padding: 16px;
    }
    .action-box .main-text { font-size: 15px; line-height: 1.6; color: #333; }

    .toggle-details {
      width: 100%; padding: 12px; background: #f5f7fa;
      border: 1px solid #e0e0e0; border-radius: 12px;
      font-size: 14px; color: #555; cursor: pointer; font-weight: 600;
      margin-top: 4px;
    }
    .toggle-details:active { background: #ebebeb; }

    .bar-section { display: none; margin-top: 12px; }
    .bar-section.open { display: block; }
    .bar-section h3 { font-size: 13px; color: #888; margin-bottom: 12px; }

    .bar-item { margin-bottom: 12px; }
    .bar-label { font-size: 13px; color: #333; font-weight: 600; margin-bottom: 2px; }
    .bar-desc { font-size: 11px; color: #888; margin-bottom: 4px; line-height: 1.4; }
    .bar-meta { font-size: 11px; color: #999; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .bar-bg { background: #e8e8e8; border-radius: 6px; height: 8px; }
    .bar-fill { background: #1F5C9E; height: 8px; border-radius: 6px; transition: width 0.6s ease; }

    .disclaimer {
      font-size: 11px; color: #999; text-align: center;
      margin-top: 20px; padding: 0 10px; line-height: 1.6;
    }

    .loading { text-align: center; padding: 20px; display: none; }
    .loading p { color: #1F5C9E; font-size: 14px; margin-top: 10px; }
  </style>
</head>
<body>

<div class="header">
  <h1>🩺 AI 皮膚狀態偵測</h1>
  <p>用白話告訴你，這看起來像什麼、該怎麼辦</p>
</div>

<div class="container">

  <div class="upload-box" onclick="document.getElementById('fileInput').click()">
    <input type="file" id="fileInput" accept="image/*" capture="environment">
    <div class="icon">📷</div>
    <p>點此拍照或上傳皮膚照片</p>
  </div>

  <img id="preview">
  <button class="btn" id="analyzeBtn" onclick="analyze()">開始 AI 分析</button>

  <div class="loading" id="loading">
    <div style="font-size:40px">⏳</div>
    <p>AI 分析中，請稍候...</p>
  </div>

  <div class="result-card" id="resultCard">
    <h2>📋 分析結果</h2>

    <div class="result-title">
      <div class="simple-name" id="resSimpleName">-</div>
      <div class="pro-name" id="resProName">-</div>
    </div>

    <div class="section">
      <div class="tag">這看起來像什麼？</div>
      <div class="highlight-box">
        <div class="main-text" id="resDescription">-</div>
      </div>
    </div>

    <div class="section">
      <div class="tag">嚴重嗎？</div>
      <div class="severity-banner" id="severityBanner">
        <div class="main" id="resSeverityText">-</div>
      </div>
      <p class="confidence-hint" id="resConfHint"></p>
    </div>

    <div class="section">
      <div class="tag">我該怎麼辦？</div>
      <div class="action-box">
        <div class="main-text" id="resAction">-</div>
      </div>
    </div>

    <button type="button" class="toggle-details" id="toggleDetails" onclick="toggleBarChart()">
      ▶ 查看完整分析（醫療專業資訊）
    </button>

    <div class="bar-section" id="barSection">
      <h3>各類別可能程度（僅供參考）</h3>
      <div id="barChart"></div>
    </div>
  </div>

  <p class="disclaimer">
    ⚠️ 本系統為 AI 輔助初篩工具，結果僅供參考，<br>無法取代專業醫師診斷，如有疑慮請就醫。
  </p>

</div>

<script>
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const analyzeBtn = document.getElementById('analyzeBtn');
  let barChartOpen = false;

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
    analyzeBtn.style.display = 'block';
    document.getElementById('resultCard').style.display = 'none';
    barChartOpen = false;
    document.getElementById('barSection').classList.remove('open');
    document.getElementById('toggleDetails').textContent =
      '▶ 查看完整分析（醫療專業資訊）';
  });

  function toggleBarChart() {
    barChartOpen = !barChartOpen;
    document.getElementById('barSection').classList.toggle('open', barChartOpen);
    document.getElementById('toggleDetails').textContent = barChartOpen
      ? '▼ 收起完整分析'
      : '▶ 查看完整分析（醫療專業資訊）';
  }

  async function analyze() {
    const file = fileInput.files[0];
    if (!file) return;

    analyzeBtn.style.display = 'none';
    document.getElementById('loading').style.display = 'block';

    const formData = new FormData();
    formData.append('image', file);

    const res = await fetch('/predict', { method: 'POST', body: formData });
    const data = await res.json();

    document.getElementById('loading').style.display = 'none';

    document.getElementById('resSimpleName').textContent = data.simple_name;
    document.getElementById('resProName').textContent = data.name;

    document.getElementById('resDescription').textContent = data.description;

    document.getElementById('resSeverityText').textContent = data.severity_text;
    document.getElementById('resConfHint').textContent =
      'AI 判斷信心約 ' + data.confidence + '%（僅供參考）';

    const banner = document.getElementById('severityBanner');
    banner.className = 'severity-banner severity-' + data.severity_level;

    document.getElementById('resAction').textContent = data.action;

    const barChart = document.getElementById('barChart');
    barChart.innerHTML = data.all_predictions
      .sort((a, b) => b.prob - a.prob)
      .map(p => `
        <div class="bar-item">
          <div class="bar-label">${p.simple_name}（${p.name}）</div>
          <div class="bar-desc">${p.description || ''}</div>
          <div class="bar-meta"><span>可能程度</span><span>${p.prob}%</span></div>
          <div class="bar-bg"><div class="bar-fill" style="width:${p.prob}%"></div></div>
        </div>
      `).join('');

    barChartOpen = false;
    document.getElementById('barSection').classList.remove('open');
    document.getElementById('toggleDetails').textContent =
      '▶ 查看完整分析（醫療專業資訊）';

    document.getElementById('resultCard').style.display = 'block';
    analyzeBtn.style.display = 'block';
  }
</script>

</body>
</html>
